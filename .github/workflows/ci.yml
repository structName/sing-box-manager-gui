name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Check deployment sensitive data
        run: scripts/check-deployment-sensitive-data.sh

      - name: Test backend
        run: go test ./...

      - name: Build backend
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -o sbm ./cmd/sbm/

  # Named regression gate for #23 / v0.2.22 (issue #63). Lightweight: no frontend build.
  socks-rename-gate:
    name: Socks mihomo + rename-cascade gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Socks/rename regression (make test-socks-rename-gate)
        run: make test-socks-rename-gate

